port 1194
proto udp
dev tun
topology subnet
server 10.250.0.0 255.255.0.0
push "redirect-gateway def1 ipv6"
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"
keepalive 2 10
tls-version-min 1.2
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
tls-cipher TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384:TLS-ECDHE-ECDSA-WITH-CHACHA20-POLY1305-SHA256
tls-groups X25519:secp384r1:secp256r1
explicit-exit-notify 1
duplicate-cn
persist-key
persist-tun
mute-replay-warnings
sndbuf 0
rcvbuf 0
tun-mtu 1500
mssfix 1420
verb 3
mute 20
#plugin /usr/lib/openvpn/openvpn-auth-ldap.so "/etc/openvpn/ldap.conf"
<ca>
{{ .CA -}}
</ca>
<cert>
{{ .Cert -}}
</cert>
<key>
{{ .Key -}}
</key>
<dh>
{{ .DH -}}
</dh>
<crl-verify>
{{ .CRL -}}
</crl-verify>
