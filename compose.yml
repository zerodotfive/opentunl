services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: opentunl
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opentunl"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always
  server:
    image: ghcr.io/zerodotfive/opentunl:latest
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
